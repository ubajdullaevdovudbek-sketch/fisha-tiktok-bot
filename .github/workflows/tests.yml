name: tests
on:
  workflow_dispatch:
  push:
    branches: [main, feature/fast-photo-carousel-no-daily-cap]
  pull_request:
    branches: [main]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker syntax
        run: node --check cloudflare/src/index.js
      - name: Install local D1 test runtime
        working-directory: cloudflare
        run: npm install --no-save miniflare@^3
      - name: Test Worker access controls and local D1 integration
        working-directory: cloudflare
        run: timeout --signal=TERM --kill-after=15s 180s node --test --test-concurrency=1 tests/*.test.mjs
