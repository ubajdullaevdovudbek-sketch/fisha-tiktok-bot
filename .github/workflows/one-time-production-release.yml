name: one-time-production-release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-production-release.yml"

permissions:
  contents: read

concurrency:
  group: fisha-one-time-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate required credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_API_SECRET: ${{ secrets.WORKER_API_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID WORKER_API_SECRET BOT_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be 32 hex characters."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify production D1 schema (read-only)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          SQL="SELECT CASE WHEN (SELECT COUNT(*) FROM pragma_table_info('videos') WHERE name IN ('publishing_started_at','album_next_offset','album_pending_offset','album_total_count','attempt_count','next_attempt_at','source_key','tiktok_video_id')) = 8 AND EXISTS (SELECT 1 FROM sqlite_master WHERE type='table' AND name='audio_jobs') THEN 'SCHEMA_READY' ELSE 'SCHEMA_NOT_READY' END AS release_gate;"
          OUTPUT="$(npx --yes wrangler@4 d1 execute fisha-tiktok-queue --remote --command "$SQL" 2>&1)"
          printf '%s\\n' "$OUTPUT"
          grep -q 'SCHEMA_READY' <<<"$OUTPUT" || { echo "::error::D1 schema gate failed."; exit 1; }

      - name: Deploy Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          npx --yes wrangler@4 deploy --config wrangler.toml

      - name: Resolve Worker URL and verify health
        id: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          SUBDOMAIN="$(printf '%s' "$RESPONSE" | jq -er 'select(.success == true) | .result.subdomain')"
          WORKER_URL="https://fisha-tiktok-bot.$SUBDOMAIN.workers.dev"
          curl --retry 5 --retry-delay 2 --retry-connrefused -fsS "$WORKER_URL/health" | jq -e '.ok == true' >/dev/null
          echo "worker_api_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Worker health check passed: $WORKER_URL"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install publishing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Publish queued video jobs 9–15
        env:
          WORKER_API_URL: ${{ steps.worker.outputs.worker_api_url }}
          WORKER_API_SECRET: ${{ secrets.WORKER_API_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID || '@zadrot1705' }}
          MAX_VIDEO_MB: "48"
          MAX_JOBS_PER_RUN: "10"
        run: python scripts/process_queue.py

      - name: Verify final queue state (read-only)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          SQL="SELECT id, status, attempt_count, next_attempt_at FROM videos WHERE id BETWEEN 9 AND 15 ORDER BY id;"
          npx --yes wrangler@4 d1 execute fisha-tiktok-queue --remote --command "$SQL"
