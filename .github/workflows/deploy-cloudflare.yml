name: deploy-cloudflare

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "I confirm this deploy targets the production fisha-tiktok-bot Worker"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    # Two independent gates: a repository variable and an explicit manual confirmation.
    if: github.ref == 'refs/heads/main' && vars.ALLOW_PRODUCTION_DEPLOY == 'true' && inputs.confirm_production_deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal account ID."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # This workflow deploys code only. It never changes secrets, D1, or Telegram webhook.
      - name: Deploy Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN
          npx --yes wrangler@4 deploy --config wrangler.toml

      - name: Verify Worker health
        env:
          WORKER_URL: https://fisha-tiktok-bot.ubajdullaevbek.workers.dev
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-connrefused -fsS "$WORKER_URL/health" | jq -e '.ok == true' >/dev/null
          echo "Worker health check passed."
