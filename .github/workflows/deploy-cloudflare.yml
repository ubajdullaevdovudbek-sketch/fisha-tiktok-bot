name: deploy-cloudflare

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "I confirm this deploy targets the production fisha-tiktok-bot Worker"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    # Two independent gates: a repository variable and an explicit manual confirmation.
    if: github.ref == 'refs/heads/main' && vars.ALLOW_PRODUCTION_DEPLOY == 'true' && inputs.confirm_production_deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal account ID."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Read-only gate: require every D1 field/table used by the feature Worker before deploy.
      - name: Verify production D1 schema (read-only)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN
          SQL="SELECT CASE WHEN (SELECT COUNT(*) FROM pragma_table_info('videos') WHERE name IN ('publishing_started_at','album_next_offset','album_pending_offset','album_total_count','attempt_count','next_attempt_at','source_key','tiktok_video_id')) = 8 AND EXISTS (SELECT 1 FROM sqlite_master WHERE type='table' AND name='audio_jobs') THEN 'SCHEMA_READY' ELSE 'SCHEMA_NOT_READY' END AS release_gate;"
          OUTPUT="$(npx --yes wrangler@4 d1 execute fisha-tiktok-queue --remote --command "$SQL" 2>&1)"
          printf '%s\\n' "$OUTPUT"
          if ! grep -Eq 'SCHEMA_READY([[:space:]]|$)' <<<"$OUTPUT"; then
            echo "::error::Production D1 schema is not ready; Worker deployment stopped."
            exit 1
          fi

      # This workflow deploys code only. It never changes secrets, D1, or Telegram webhook.
      - name: Deploy Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN
          npx --yes wrangler@4 deploy --config wrangler.toml

      - name: Verify Worker health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          SUBDOMAIN="$(printf '%s' "$RESPONSE" | jq -er 'select(.success == true) | .result.subdomain')"
          WORKER_URL="https://fisha-tiktok-bot.$SUBDOMAIN.workers.dev"
          curl --retry 5 --retry-delay 2 --retry-connrefused -fsS "$WORKER_URL/health" | jq -e '.ok == true' >/dev/null
          echo "Worker health check passed."
