name: audit-cloudflare-d1-migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # Read-only Wrangler migration inventory. No migration apply, Worker deploy,
    # secret mutation, webhook change, queue claim, or Telegram publication.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal account ID."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: List remote D1 migration history (read-only)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN
          npx --yes wrangler@4 d1 migrations list fisha-tiktok-queue --remote --config wrangler.toml
