name: migrate-cloudflare-d1

on:
  workflow_dispatch:
    inputs:
      confirm_production_migrations:
        description: "I confirm applying D1 migrations 0002–0006 to production fisha-tiktok-queue"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fisha-production-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_migrations == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal account ID."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirm exact pending migration set
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          npx --yes wrangler@4 d1 migrations list fisha-tiktok-queue --remote --config wrangler.toml | tee /tmp/migrations-before.txt
          for migration in 0002_delivery_uncertain.sql 0003_audio_jobs.sql 0004_photo_album_progress.sql 0005_photo_batch_reconciliation.sql 0006_video_retry_and_dedupe.sql; do
            grep -Fq "$migration" /tmp/migrations-before.txt || {
              echo "::error::Expected pending migration missing: $migration"
              exit 1
            }
          done
          count="$(grep -Ec '000[2-6]_[a-z_]+\.sql' /tmp/migrations-before.txt)"
          test "$count" -eq 5 || {
            echo "::error::Unexpected pending migration set; refusing to apply."
            exit 1
          }

      - name: Apply production D1 migrations
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          npx --yes wrangler@4 d1 migrations apply fisha-tiktok-queue --remote --config wrangler.toml

      - name: Verify migration history and production schema
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          npx --yes wrangler@4 d1 migrations list fisha-tiktok-queue --remote --config wrangler.toml | tee /tmp/migrations-after.txt
          if grep -Eq 'Migrations to be applied:|000[2-6]_[a-z_]+\.sql' /tmp/migrations-after.txt; then
            echo "::error::Pending migrations remain after apply."
            exit 1
          fi
          npx --yes wrangler@4 d1 execute fisha-tiktok-queue --remote --config wrangler.toml --command "SELECT COUNT(*) AS video_count FROM videos; SELECT COUNT(*) AS audio_jobs_count FROM audio_jobs;"
