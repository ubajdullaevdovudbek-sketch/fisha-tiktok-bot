name: TikTok Photo Mode smoke test

on:
  workflow_dispatch:
    inputs:
      tiktok_url:
        description: Public TikTok Photo Mode URL to download (no Telegram publishing)
        required: true
        type: string
        default: "https://www.tiktok.com/@mdt_ali/photo/7706276795384958260"

permissions:
  contents: read

jobs:
  photo-download-smoke:
    if: github.ref == 'refs/heads/feature/fast-photo-carousel-no-daily-cap'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fast-photo-carousel-no-daily-cap
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated downloader dependencies
        run: python -m pip install requests gallery-dl
      - name: Download and verify public Photo Mode slides
        env:
          TIKTOK_URL: ${{ inputs.tiktok_url }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import tempfile
          from pathlib import Path
          from app.tiktok_photos import download_tiktok_photos, resolve_tiktok_url

          supplied = os.environ["TIKTOK_URL"].strip()
          resolved = resolve_tiktok_url(supplied)
          print(f"Resolved URL: {resolved}")
          with tempfile.TemporaryDirectory(prefix="tiktok-photo-smoke-") as tmp:
              photos = download_tiktok_photos(resolved, Path(tmp))
              print(f"Downloaded slide count: {len(photos)}")
              for index, photo in enumerate(photos, 1):
                  digest = hashlib.sha256(photo.read_bytes()).hexdigest()
                  print(f"Slide {index:02d}: {photo.name} | {photo.stat().st_size} bytes | sha256={digest}")
              if len(photos) != 6:
                  raise SystemExit(f"Expected 6 slides based on public post metadata, got {len(photos)}")
          PY
