name: publish-queue

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: fisha-publish-queue
  cancel-in-progress: false

jobs:
  publish-queue:
    # This workflow publishes to the live Telegram channel; never run it from feature branches.
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate required secrets
        env:
          WORKER_API_SECRET: ${{ secrets.WORKER_API_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID || '@zadrot1705' }}
        run: |
          set -euo pipefail
          missing=()
          for name in WORKER_API_SECRET BOT_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if (("${#missing[@]}" > 0)); then
            printf '::error::Missing required GitHub Actions secrets: %s\\n' "${missing[*]}"
            exit 1
          fi
          if [ -z "$CHANNEL_ID" ]; then
            echo "::error::CHANNEL_ID is empty; set the CHANNEL_ID secret or update the public channel fallback."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Ensure FFmpeg is available and install Python dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          else
            echo "FFmpeg already present on the GitHub runner; skipping apt installation."
          fi
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve and verify Worker URL
        id: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN
          RESPONSE="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          SUBDOMAIN="$(printf '%s' "$RESPONSE" | jq -er 'select(.success == true) | .result.subdomain')"
          WORKER_URL="https://fisha-tiktok-bot.$SUBDOMAIN.workers.dev"
          curl -fsS "$WORKER_URL/health" | jq -e '.ok == true' >/dev/null
          echo "worker_api_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Worker health check passed."

      - name: Process queued videos
        env:
          WORKER_API_URL: ${{ steps.worker.outputs.worker_api_url }}
          WORKER_API_SECRET: ${{ secrets.WORKER_API_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID || '@zadrot1705' }}
          MAX_VIDEO_MB: "48"
          MAX_JOBS_PER_RUN: "5"
        run: python scripts/process_queue.py
